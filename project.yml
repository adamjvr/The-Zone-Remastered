name: TheZoneRemastered
options:
  bundleIdPrefix: com.thezone.remastered
targets:
  ZoneCore:
    type: library.static
    platform: auto
    supportedDestinations: [macOS, iOS]
    sources: [ZoneCore/src, ZoneCore/Recovered/src]
    headers: [ZoneCore/include, ZoneCore/Recovered/include]
    settings:
      base:
        SDKROOT: auto
        SUPPORTED_PLATFORMS: "macosx iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
  The Zone macOS:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources: [Shared, macOS]
    resources: [macOS/Assets.xcassets, Resources/Sprites, Resources/Sounds]
    dependencies: [{target: ZoneCore}]
    settings:
      base:
        SDKROOT: macosx
        SUPPORTED_PLATFORMS: macosx
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: 2
  The Zone iPadOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    info:
      path: iPadOS/Info.plist
    sources: [Shared, iPadOS]
    resources: [Resources/Sprites, Resources/Sounds]
    dependencies: [{target: ZoneCore}]
    settings:
      base:
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: 2
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
